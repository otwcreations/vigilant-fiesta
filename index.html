<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>BMO Live Beacon, Emoji Board &amp; Messenger</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111317;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #181b20;
      border-bottom: 1px solid #2b303b;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #4fc3f7;
    }
    .sub-badge {
      font-size: 12px;
      color: #9ca3af;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 370px;
      flex: 1;
      min-height: calc(100vh - 52px);
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 440px;
      background: #1c2026;
    }

    .sidebar {
      background: #16191f;
      border-left: 1px solid #2b303b;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      max-height: calc(100vh - 52px);
    }

    .card {
      background: #1e222b;
      border: 1px solid #2e3442;
      border-radius: 12px;
      padding: 15px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #4fc3f7;
      margin-bottom: 8px;
    }

    .hero-box {
      text-align: center;
      padding: 6px 0;
    }
    .hero-emoji {
      font-size: 64px;
      line-height: 1.1;
      margin: 4px 0;
    }
    .hero-title {
      font-size: 17px;
      font-weight: 700;
    }
    .hero-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }

    .msg-desc {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      background: #13161c;
      color: #f3f4f6;
      border: 1px solid #353c4a;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #4fc3f7;
    }
    .send-btn {
      background: #38ad6b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .send-btn:hover { opacity: 0.9; }
    #msgStatus {
      margin-top: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 280px;
      overflow-y: auto;
    }
    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16191f;
      border: 1px solid #2a303c;
      border-radius: 8px;
      padding: 8px 11px;
    }
    .log-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .log-emoji { font-size: 24px; line-height: 1; }
    .log-name { font-size: 14px; font-weight: 600; }
    .log-time { font-size: 11px; color: #9ca3af; text-align: right; }

    .pin-label {
      background: rgba(20, 23, 29, 0.92);
      color: #fff;
      border: 1px solid #4fc3f7;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pin-label-latest {
      border-color: #ff5722;
      font-size: 14px;
    }

    @media (max-width: 840px) {
      .dashboard { grid-template-columns: 1fr; }
      #map { height: 52vh; min-height: 320px; }
      .sidebar { border-left: none; border-top: 1px solid #2b303b; max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">BMO Friendlyrobot &bull; Live Beacon &amp; Messenger</div>
    <div class="sub-badge" id="sync-status">Connecting to ThingSpeak...</div>
  </header>

  <div class="dashboard">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="card hero-box">
        <div class="card-label">Latest Emoji Status</div>
        <div id="hero-emoji" class="hero-emoji">⏳</div>
        <div id="hero-label" class="hero-title">Loading...</div>
        <div id="hero-time" class="hero-time"></div>
      </div>

      <div class="card">
        <div class="card-label">Send Message to Device</div>
        <p class="msg-desc">Send a text message directly to the device screen</p>
        <div class="input-row
