<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>BMO Live Beacon, Emoji Board &amp; Messenger</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111317;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #181b20;
      border-bottom: 1px solid #2b303b;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #4fc3f7;
    }
    .sub-badge {
      font-size: 12px;
      color: #9ca3af;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 370px;
      flex: 1;
      min-height: calc(100vh - 52px);
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 440px;
      background: #1c2026;
    }

    .sidebar {
      background: #16191f;
      border-left: 1px solid #2b303b;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      max-height: calc(100vh - 52px);
    }

    .card {
      background: #1e222b;
      border: 1px solid #2e3442;
      border-radius: 12px;
      padding: 15px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #4fc3f7;
      margin-bottom: 8px;
    }

    .hero-box {
      text-align: center;
      padding: 6px 0;
    }
    .hero-emoji {
      font-size: 64px;
      line-height: 1.1;
      margin: 4px 0;
    }
    .hero-title {
      font-size: 17px;
      font-weight: 700;
    }
    .hero-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }

    .msg-desc {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      background: #13161c;
      color: #f3f4f6;
      border: 1px solid #353c4a;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #4fc3f7;
    }
    .send-btn {
      background: #38ad6b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .send-btn:hover { opacity: 0.9; }
    #msgStatus {
      margin-top: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 280px;
      overflow-y: auto;
    }
    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16191f;
      border: 1px solid #2a303c;
      border-radius: 8px;
      padding: 8px 11px;
    }
    .log-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .log-emoji { font-size: 24px; line-height: 1; }
    .log-name { font-size: 14px; font-weight: 600; }
    .log-time { font-size: 11px; color: #9ca3af; text-align: right; }

    .pin-label {
      background: rgba(20, 23, 29, 0.92);
      color: #fff;
      border: 1px solid #4fc3f7;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pin-label-latest {
      border-color: #ff5722;
      font-size: 14px;
    }

    @media (max-width: 840px) {
      .dashboard { grid-template-columns: 1fr; }
      #map { height: 52vh; min-height: 320px; }
      .sidebar { border-left: none; border-top: 1px solid #2b303b; max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">BMO Friendlyrobot &bull; Live Beacon &amp; Messenger</div>
    <div class="sub-badge" id="sync-status">Connecting to ThingSpeak...</div>
  </header>

  <div class="dashboard">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="card hero-box">
        <div class="card-label">Latest Emoji Status</div>
        <div id="hero-emoji" class="hero-emoji">⏳</div>
        <div id="hero-label" class="hero-title">Loading...</div>
        <div id="hero-time" class="hero-time"></div>
      </div>

      <div class="card">
        <div class="card-label">Send Message to Device</div>
        <p class="msg-desc">Send a text message directly to the device screen</p>
        <div class="input-row">
          <input type="text" id="msgInput" maxlength="240" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendPublicMsg()">
          <button type="button" class="send-btn" onclick="sendPublicMsg()">Send</button>
        </div>
        <div id="msgStatus">Messages appear on the device within 30 seconds</div>
      </div>

      <div class="card">
        <div class="card-label">Recent Emoji Log</div>
        <div id="emoji-log" class="log-list">
          <div style="font-size:12px;color:#9ca3af;">Loading recent emojis...</div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const CHANNEL_ID        = "3597939";
    const FETCH_COUNT       = 200;
    const MAX_BEACON_PINS   = 20;
    const MIN_PIN_DIST_FEET = 200;
    const MSG_TALKBACK_ID   = "58554";
    const MSG_TALKBACK_KEY  = "NBNAMBLAE861C017";

    const EMOJI_LOOKUP = {
      "Smile":       "😊",
      "Grin":        "😁",
      "Laugh":       "😂",
      "Wink":        "😉",
      "Love":        "😍",
      "Cool":        "😎",
      "Sad":         "😢",
      "Angry":       "😠",
      "Surprised":   "😮",
      "Thumbs Up":   "👍",
      "Thumbs Down": "👎",
      "OK Hand":     "👌",
      "Peace":       "✌️",
      "Wave":        "👋",
      "Thanks":      "🙏",
      "Heart":       "❤️",
      "Confirmed":   "✅"
    };

    const BEACON_TAG_EMOJI_LOOKUP = {
      "Thumbs Up":   "👍",
      "Thumbs Down": "👎",
      "Warning":     "⚠️",
      "Question":    "❓",
      "Happy":       "😊",
      "Angry":       "😠",
      "Sad":         "😢",
      "Smile":       "😊"
    };

    function resolveEmoji(entry) {
      const label = (entry.field2 || "").trim();
      if (EMOJI_LOOKUP[label]) return EMOJI_LOOKUP[label];
      const raw = (entry.field1 || "").trim();
      if (raw && !raw.includes("?")) return raw;
      return "🙂";
    }

    function formatBeaconTags(rawField2) {
      const cleaned = (rawField2 || "").trim();
      if (!cleaned || cleaned === "No Tags") return "📍 Pin";

      return cleaned
        .split(",")
        .map(part => {
          const tag = part.trim();
          return BEACON_TAG_EMOJI_LOOKUP[tag] || tag;
        })
        .join(" ");
    }

    function distanceFeet(lat1, lng1, lat2, lng2) {
      const R_FEET = 20902231;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R_FEET * c;
    }

    L.TileLayer.prototype.options.referrerPolicy = "strict-origin-when-cross-origin";

    const map = L.map("map", { zoomControl: true }).setView([40.1672, -105.1019], 11);

    const esriStreets = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      attribution: "&copy; Esri",
      maxZoom: 19
    }).addTo(map);

    const osmStreets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      referrerPolicy: "strict-origin-when-cross-origin",
      maxZoom: 19
    });

    const satelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      attribution: "&copy; Esri",
      maxZoom: 19
    });

    L.control.layers({
      "City & Streets (HD)": esriStreets,
      "OpenStreetMap": osmStreets,
      "Satellite": satelliteLayer
    }).addTo(map);

    setTimeout(() => map.invalidateSize(), 250);

    const markerGroup = L.layerGroup().addTo(map);
    let firstLoad = true;

    function formatTime(iso) {
      return new Date(iso).toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function sendPublicMsg() {
      const inputEl  = document.getElementById("msgInput");
      const statusEl = document.getElementById("msgStatus");
      const text     = inputEl.value.trim();

      if (!text) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Please type a message first.";
        return;
      }

      statusEl.style.color = "#93c5fd";
      statusEl.textContent = "Sending message...";

      const targetUrl = "https://api.thingspeak.com/talkbacks/" + MSG_TALKBACK_ID + "/commands";
      const payload = "api_key=" + encodeURIComponent(MSG_TALKBACK_KEY) +
                      "&command_string=" + encodeURIComponent("MSG:" + text);

      fetch(targetUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: payload
      }).then(() => {
        inputEl.value = "";
        statusEl.style.color = "#4ade80";
        statusEl.textContent = 'Sent! "' + text + '" will display within 30s.';
      }).catch(err => {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Send failed: " + err;
      });
    }

    function renderFeedData(data) {
      const feeds = (data && data.feeds) ? data.feeds : [];

      const emojis = feeds
        .filter(f => (f.field1 || f.field2) && (f.field1 || "").trim().toUpperCase() !== "BEACON")
        .reverse();

      const logEl = document.getElementById("emoji-log");

      if (emojis.length > 0) {
        const newest = emojis[0];
        document.getElementById("hero-emoji").textContent = resolveEmoji(newest);
        document.getElementById("hero-label").textContent = newest.field2 || "Emoji";
        document.getElementById("hero-time").textContent = formatTime(newest.created_at);

        logEl.innerHTML = "";
        emojis.slice(0, 15).forEach((entry, idx) => {
          const row = document.createElement("div");
          row.className = "log-item";
          row.innerHTML = `
            <div class="log-left">
              <span class="log-emoji">${resolveEmoji(entry)}</span>
              <span class="log-name">${entry.field2 || "Emoji"}${idx === 0 ? " (Latest)" : ""}</span>
            </div>
            <div class="log-time">${formatTime(entry.created_at)}</div>
          `;
          logEl.appendChild(row);
        });
      } else {
        document.getElementById("hero-emoji").textContent = "🙂";
        document.getElementById("hero-label").textContent = "No emojis posted yet";
        logEl.innerHTML = '<div style="font-size:12px;color:#9ca3af;">No emoji posts found yet.</div>';
      }

      const rawBeaconsNewestFirst = feeds
        .filter(f =>
          f.field1 &&
          f.field1.trim().toUpperCase() === "BEACON" &&
          f.latitude && f.longitude &&
          Math.abs(parseFloat(f.latitude)) > 0.001
        )
        .reverse();

      const filteredNewestFirst = [];
      for (const candidate of rawBeaconsNewestFirst) {
        if (filteredNewestFirst.length >= MAX_BEACON_PINS) break;
        const cLat = parseFloat(candidate.latitude);
        const cLng = parseFloat(candidate.longitude);

        const tooCloseToNewerPin = filteredNewestFirst.some(kept => {
          const kLat = parseFloat(kept.latitude);
          const kLng = parseFloat(kept.longitude);
          return distanceFeet(cLat, cLng, kLat, kLng) <= MIN_PIN_DIST_FEET;
        });

        if (!tooCloseToNewerPin) {
          filteredNewestFirst.push(candidate);
        }
      }

      const beaconsToPlot = filteredNewestFirst.reverse();

      markerGroup.clearLayers();
      const coordsList = [];

      beaconsToPlot.forEach((b, idx) => {
        const lat = parseFloat(b.latitude);
        const lng = parseFloat(b.longitude);
        const isLatest = (idx === beaconsToPlot.length - 1);
        const rawTagText = b.field2 || "No Tags";
        const displayTags = formatBeaconTags(b.field2);
        const timeStr = formatTime(b.created_at);

        coordsList.push([lat, lng]);

        const marker = L.circleMarker([lat, lng], {
          radius: isLatest ? 11 : 8,
          fillColor: isLatest ? "#ff5722" : "#0288d1",
          color: "#ffffff",
          weight: 2,
          fillOpacity: 0.95
        });

        marker.bindPopup(`
          <div style="color:#111;font-family:sans-serif;min-width:155px;">
            <strong>${isLatest ? "📍 Latest Beacon" : "📌 Beacon Pin"}</strong><br/>
            <b>Tags:</b> ${displayTags} <span style="color:#555;font-size:11px;">(${rawTagText})</span><br/>
            <b>Time:</b> ${timeStr}<br/>
            <small>${lat.toFixed(5)}, ${lng.toFixed(5)}</small>
          </div>
        `);

        marker.bindTooltip(`${displayTags} (${timeStr})`, {
          permanent: true,
          direction: "top",
          offset: [0, -10],
          className: isLatest ? "pin-label pin-label-latest" : "pin-label"
        });

        marker.addTo(markerGroup);
      });

      if (coordsList.length > 1) {
        L.polyline(coordsList, { color: "#4fc3f7", weight: 2, dashArray: "6, 6" }).addTo(markerGroup);
      }

      if (firstLoad && coordsList.length > 0) {
        if (coordsList.length === 1) {
          map.setView(coordsList[0], 14);
        } else {
          map.fitBounds(L.latLngBounds(coordsList), { padding: [45, 45], maxZoom: 15 });
        }
        firstLoad = false;
      }

      document.getElementById("sync-status").textContent =
        `Live (${beaconsToPlot.length} pins) • Updated ` +
        new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    async function updateFeed() {
      const statusEl = document.getElementById("sync-status");
      try {
        const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=${FETCH_COUNT}&location=true`;
        const res = await fetch(url);
        if (!res.ok) {
          statusEl.textContent = "ThingSpeak HTTP " + res.status + " — retrying...";
          return;
        }
        const data = await res.json();
        renderFeedData(data);
      } catch (err) {
        console.error("ThingSpeak fetch error:", err);
        statusEl.textContent = "Network error — retrying...";
      }
    }

    updateFeed();
    setInterval(updateFeed, 12000);
  </script>
</body>
</html>
