<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>BMO Live Beacon, Emoji Board &amp; Messenger</title>

  <!-- Leaflet High-Definition Interactive Map Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111317;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #181b20;
      border-bottom: 1px solid #2b303b;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #4fc3f7;
    }
    .sub-badge {
      font-size: 12px;
      color: #9ca3af;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 370px;
      flex: 1;
      min-height: calc(100vh - 52px);
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 440px;
      background: #1c2026;
    }

    .sidebar {
      background: #16191f;
      border-left: 1px solid #2b303b;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      max-height: calc(100vh - 52px);
    }

    .card {
      background: #1e222b;
      border: 1px solid #2e3442;
      border-radius: 12px;
      padding: 15px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #4fc3f7;
      margin-bottom: 8px;
    }

    /* 1. Latest Emoji Hero Card */
    .hero-box {
      text-align: center;
      padding: 6px 0;
    }
    .hero-emoji {
      font-size: 64px;
      line-height: 1.1;
      margin: 4px 0;
    }
    .hero-title {
      font-size: 17px;
      font-weight: 700;
    }
    .hero-time {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 3px;
    }

    /* 2. Direct Text Message Box (TalkBack 58554) */
    .msg-desc {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      background: #13161c;
      color: #f3f4f6;
      border: 1px solid #353c4a;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #4fc3f7;
    }
    .send-btn {
      background: #38ad6b;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .send-btn:hover { opacity: 0.9; }
    #msgStatus {
      margin-top: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
    }

    /* 3. Recent Emoji Log */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      max-height: 280px;
      overflow-y: auto;
    }
    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16191f;
      border: 1px solid #2a303c;
      border-radius: 8px;
      padding: 8px 11px;
    }
    .log-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .log-emoji { font-size: 24px; line-height: 1; }
    .log-name { font-size: 14px; font-weight: 600; }
    .log-time { font-size: 11px; color: #9ca3af; text-align: right; }

    .pin-label {
      background: rgba(20, 23, 29, 0.92);
      color: #fff;
      border: 1px solid #4fc3f7;
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    @media (max-width: 840px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      #map {
        height: 52vh;
        min-height: 320px;
      }
      .sidebar {
        border-left: none;
        border-top: 1px solid #2b303b;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">BMO Friendlyrobot &bull; Live Beacon &amp; Messenger</div>
    <div class="sub-badge" id="sync-status">Connecting to ThingSpeak...</div>
  </header>

  <div class="dashboard">
    <!-- Left: Interactive HD Map -->
    <div id="map"></div>

    <!-- Right: Emoji Board + Send Message Box + Recent Timeline -->
    <aside class="sidebar">
      <!-- Latest Emoji Card -->
      <div class="card hero-box">
        <div class="card-label">Latest Emoji Status</div>
        <div id="hero-emoji" class="hero-emoji">⏳</div>
        <div id="hero-label" class="hero-title">Loading...</div>
        <div id="hero-time" class="hero-time"></div>
      </div>

      <!-- Direct Message Box -->
      <div class="card">
        <div class="card-label">Send Message to Device</div>
        <p class="msg-desc">Send a text message directly to the device screen</p>
        <div class="input-row">
          <input type="text" id="msgInput" maxlength="240" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendPublicMsg()">
          <button type="button" class="send-btn" onclick="sendPublicMsg()">Send</button>
        </div>
        <div id="msgStatus">Messages appear on the device within 30 seconds</div>
      </div>

      <!-- Chronological Recent Emoji Log -->
      <div class="card">
        <div class="card-label">Recent Emoji Log</div>
        <div id="emoji-log" class="log-list">
          <div style="font-size:12px;color:#9ca3af;">Loading recent emojis...</div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const CHANNEL_ID       = "3597939";
    const FETCH_COUNT      = 50;
    const MSG_TALKBACK_ID  = "58554";
    const MSG_TALKBACK_KEY = "NBNAMBLAE861C017";

    const EMOJI_LOOKUP = {
      "Smile":       "😊",
      "Grin":        "😁",
      "Laugh":       "😂",
      "Wink":        "😉",
      "Love":        "😍",
      "Cool":        "😎",
      "Sad":         "😢",
      "Angry":       "😠",
      "Surprised":   "😮",
      "Thumbs Up":   "👍",
      "Thumbs Down": "👎",
      "OK Hand":     "👌",
      "Peace":       "✌️",
      "Wave":        "👋",
      "Thanks":      "🙏",
      "Heart":       "❤️",
      "Confirmed":   "✅"
    };

    function resolveEmoji(entry) {
      const label = (entry.field2 || "").trim();
      if (EMOJI_LOOKUP[label]) return EMOJI_LOOKUP[label];
      const raw = (entry.field1 || "").trim();
      if (raw && !raw.includes("?")) return raw;
      return "🙂";
    }

    // ==================== 1. INTERACTIVE HD LEAFLET MAP ====================
    L.TileLayer.prototype.options.referrerPolicy = "strict-origin-when-cross-origin";

    const map = L.map("map", { zoomControl: true }).setView([40.1672, -105.1019], 11);

    // Esri World Street Map works both from local file:// and hosted HTTPS with zero API keys
    const esriStreets = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      attribution: "&copy; Esri",
      maxZoom: 19
    }).addTo(map);

    const osmStreets = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      referrerPolicy: "strict-origin-when-cross-origin",
      maxZoom: 19
    });

    const satelliteLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      attribution: "&copy; Esri",
      maxZoom: 19
    });

    L.control.layers({
      "City & Streets (HD)": esriStreets,
      "OpenStreetMap": osmStreets,
      "Satellite": satelliteLayer
    }).addTo(map);

    // Force Leaflet to recalculate container dimensions after grid render
    setTimeout(() => map.invalidateSize(), 250);

    const markerGroup = L.layerGroup().addTo(map);
    let firstLoad = true;

    function formatTime(iso) {
      return new Date(iso).toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    // ==================== 2. SEND MESSAGE TO DEVICE (TALKBACK) ====================
    function sendPublicMsg() {
      const inputEl  = document.getElementById("msgInput");
      const statusEl = document.getElementById("msgStatus");
      const text     = inputEl.value.trim();

      if (!text) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Please type a message first.";
        return;
      }

      statusEl.style.color = "#93c5fd";
      statusEl.textContent = "Sending message...";

      const host = ["api", "thingspeak", "com"].join(".");
      const path = ["", "talkbacks", MSG_TALKBACK_ID, "commands"].join("/");
      const targetUrl = "https://" + host + path;

      const payload = "api_key=" + encodeURIComponent(MSG_TALKBACK_KEY) +
                      "&command_string=" + encodeURIComponent("MSG:" + text);

      fetch(targetUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: payload
      }).then(function() {
        inputEl.value = "";
        statusEl.style.color = "#4ade80";
        statusEl.textContent = 'Sent! "' + text + '" will display within 30s.';
      }).catch(function(err) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = "Send failed: " + err;
      });
    }

    // ==================== 3. JSONP + FETCH DUAL FEED LOADER ====================
    function renderFeedData(data) {
      const feeds = (data && data.feeds) ? data.feeds : [];

      // A. Filter out BEACON rows so only Emojis populate the Emoji Board
      const emojis = feeds
        .filter(f => (f.field1 || f.field2) && (f.field1 || "").trim().toUpperCase() !== "BEACON")
        .reverse();

      const logEl = document.getElementById("emoji-log");

      if (emojis.length > 0) {
        const newest = emojis[0];
        document.getElementById("hero-emoji").textContent = resolveEmoji(newest);
        document.getElementById("hero-label").textContent = newest.field2 || "Emoji";
        document.getElementById("hero-time").textContent = formatTime(newest.created_at);

        logEl.innerHTML = "";
        emojis.slice(0, 15).forEach((entry, idx) => {
          const row = document.createElement("div");
          row.className = "log-item";
          row.innerHTML = `
            <div class="log-left">
              <span class="log-emoji">${resolveEmoji(entry)}</span>
              <span class="log-name">${entry.field2 || "Emoji"}${idx === 0 ? " (Latest)" : ""}</span>
            </div>
            <div class="log-time">${formatTime(entry.created_at)}</div>
          `;
          logEl.appendChild(row);
        });
      } else {
        document.getElementById("hero-emoji").textContent = "🙂";
        document.getElementById("hero-label").textContent = "No emojis posted yet";
        logEl.innerHTML = '<div style="font-size:12px;color:#9ca3af;">No emoji posts found yet.</div>';
      }

      // B. Filter BEACON rows with valid GPS coordinates and plot on HD map
      const beacons = feeds.filter(f =>
        f.field1 &&
        f.field1.trim().toUpperCase() === "BEACON" &&
        f.latitude && f.longitude &&
        Math.abs(parseFloat(f.latitude)) > 0.001
      );

      markerGroup.clearLayers();
      const coordsList = [];

      beacons.forEach((b, idx) => {
        const lat = parseFloat(b.latitude);
        const lng = parseFloat(b.longitude);
        const isLatest = (idx === beacons.length - 1);
        const tagText = b.field2 || "No Tags";
        const timeStr = formatTime(b.created_at);

        coordsList.push([lat, lng]);

        const marker = L.circleMarker([lat, lng], {
          radius: isLatest ? 11 : 7,
          fillColor: isLatest ? "#ff5722" : "#0288d1",
          color: "#ffffff",
          weight: 2,
          fillOpacity: 0.95
        });

        marker.bindPopup(`
          <div style="color:#111;font-family:sans-serif;min-width:150px;">
            <strong>${isLatest ? "📍 Latest Beacon" : "📌 Beacon Pin"}</strong><br/>
            <b>Tags:</b> ${tagText}<br/>
            <b>Time:</b> ${timeStr}<br/>
            <small>${lat.toFixed(5)}, ${lng.toFixed(5)}</small>
          </div>
        `);

        if (isLatest) {
          marker.bindTooltip(`${tagText} (${timeStr})`, {
            permanent: true,
            direction: "top",
            offset: [0, -10],
            className: "pin-label"
          });
        }

        marker.addTo(markerGroup);
      });

      if (coordsList.length > 1) {
        L.polyline(coordsList, { color: "#4fc3f7", weight: 2, dashArray: "6, 6" }).addTo(markerGroup);
      }

      if (firstLoad && coordsList.length > 0) {
        map.setView(coordsList[coordsList.length - 1], 13);
        firstLoad = false;
      }

      document.getElementById("sync-status").textContent =
        "Live • Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function updateFeed() {
      // JSONP script injection works reliably even when opened as a local file:// HTML page
      const cbName = "tsCallback_" + Date.now();
      const script = document.createElement("script");

      window[cbName] = function(data) {
        renderFeedData(data);
        delete window[cbName];
        script.remove();
      };

      script.onerror = function() {
        delete window[cbName];
        script.remove();
        document.getElementById("sync-status").textContent = "Check internet connection — retrying...";
      };

      script.src = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=${FETCH_COUNT}&callback=${cbName}`;
      document.body.appendChild(script);
    }

    updateFeed();
    setInterval(updateFeed, 12000);
  </script>
</body>
</html>
